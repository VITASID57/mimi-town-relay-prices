name: 每日更新中转站价目

on:
  schedule:
    - cron: "0 19 * * *"   # 北京时间每天凌晨 3 点
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查解析规则
        run: node --test tests/*.test.mjs
      - name: 抓取价目
        run: node scripts/build.mjs
      - name: 提交新价目
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "价目没有变化"; else git commit -m "价目更新 $(date -u +%Y-%m-%d)" && git push; fi
